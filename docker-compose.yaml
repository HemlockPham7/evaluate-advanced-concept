  # ============================================================
  # 1. OpenTelemetry Collector
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command:
      - "--config=/etc/otelcol-contrib/otel-collector-config.yaml"
    volumes:
      - ./deployment/collector/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC - application -> collector
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint
    depends_on:
      - tempo


  # ============================================================
  # 2. Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    volumes:
      - ./deployment/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"


  # ============================================================
  # 3. Tempo
  # ============================================================
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./deployment/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      # Collector gọi tempo:4317 bên trong Docker network.


  # ============================================================
  # 4. Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deployment/grafana/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - prometheus
      - tempo

  commonlibrary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commonlibrary
    command:
      - -javaagent:/opt/opentelemetry/opentelemetry-javaagent.jar
      - -Dotel.javaagent.configuration-file=/opt/opentelemetry/opentelemetry-config.properties
      - -jar
      - /app/app.jar
    depends_on:
      - otel-collector
    ports:
      - "8080:8080"

volumes:
  postgres_data: